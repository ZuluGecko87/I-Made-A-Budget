# Builds the installers and publishes them as a GitHub release when a version tag (v1.2.3) is pushed.
# The tag must match imab.versionName in gradle.properties.
#
# Android signing needs these repository secrets (Settings → Secrets and variables → Actions):
#   IMAB_KEYSTORE_BASE64   the release key file, base64-encoded
#   IMAB_KEYSTORE_PASSWORD
#   IMAB_KEY_ALIAS
#   IMAB_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check the tag matches the app version
        run: |
          version=$(grep '^imab.versionName=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match imab.versionName=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Release key
        env:
          IMAB_KEYSTORE_BASE64: ${{ secrets.IMAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$IMAB_KEYSTORE_BASE64" ]; then
            echo "::error::The IMAB_KEYSTORE_BASE64 secret isn't set, so the APK can't be signed."
            exit 1
          fi
          echo "$IMAB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/imab-release.jks"
          echo "IMAB_KEYSTORE_FILE=$RUNNER_TEMP/imab-release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          IMAB_KEYSTORE_PASSWORD: ${{ secrets.IMAB_KEYSTORE_PASSWORD }}
          IMAB_KEY_ALIAS: ${{ secrets.IMAB_KEY_ALIAS }}
          IMAB_KEY_PASSWORD: ${{ secrets.IMAB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :composeApp:assembleRelease
      - name: Rename
        run: |
          mkdir out
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "out/IMAB-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  mac:
    needs: version
    strategy:
      matrix:
        include:
          - name: apple-silicon
            arch: aarch64
          # An Intel (x64) Java on an Apple Silicon runner, through Rosetta, packages an Intel app.
          - name: intel
            arch: x64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: ${{ matrix.arch }}
          cache: gradle
      - name: Build
        run: ./gradlew --no-daemon :composeApp:packageDmg
      - name: Rename
        run: |
          mkdir out
          cp composeApp/build/compose/binaries/main/dmg/*.dmg "out/IMAB-${{ needs.version.outputs.version }}-mac-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.name }}
          path: out/*

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build
        shell: bash
        run: ./gradlew --no-daemon :composeApp:packageMsi
      - name: Rename
        shell: bash
        run: |
          mkdir out
          cp composeApp/build/compose/binaries/main/msi/*.msi "out/IMAB-${{ needs.version.outputs.version }}-windows.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    needs: [version, android, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version=${{ needs.version.outputs.version }}
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-install.md >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "IMAB ${{ needs.version.outputs.version }}" \
            --notes-file notes.md
