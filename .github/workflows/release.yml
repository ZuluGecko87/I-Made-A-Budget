# Builds the installers and publishes them as a GitHub release, either:
#   - from the Actions tab: Release → Run workflow (on main). It releases the version in
#     gradle.properties (imab.versionName) and creates its v<version> tag; or
#   - when a version tag (v1.2.3) is pushed. The tag must match imab.versionName.
#
# Android signing needs these repository secrets (Settings → Secrets and variables → Actions):
#   IMAB_KEYSTORE_BASE64   the release key file, base64-encoded
#   IMAB_KEYSTORE_PASSWORD
#   IMAB_KEY_ALIAS
#   IMAB_KEY_PASSWORD
#
# Hardening: actions are pinned to full commit SHAs (the tag is in the comment), jobs get read-only
# access except the one that publishes, and release builds don't use caches, so nothing from an
# earlier run can affect what gets signed and published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Gradle wrapper is the genuine one
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - id: v
        name: Work out the version and check it isn't released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^imab.versionName=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match imab.versionName=$version in gradle.properties"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run the release from the main branch."
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version is already released. Raise imab.versionName in gradle.properties first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  audit:
    # Every library in the app and the build tools must have no known vulnerabilities (OSV: CVEs
    # and GitHub advisories) at the time of release.
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Check dependencies against OSV
        run: ./gradlew --no-daemon -q buildEnvironment :composeApp:dependencies | python3 scripts/osv-check.py

  android:
    needs: [version, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Release key
        env:
          IMAB_KEYSTORE_BASE64: ${{ secrets.IMAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$IMAB_KEYSTORE_BASE64" ]; then
            echo "::error::The IMAB_KEYSTORE_BASE64 secret isn't set, so the APK can't be signed."
            exit 1
          fi
          echo "$IMAB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/imab-release.jks"
          echo "IMAB_KEYSTORE_FILE=$RUNNER_TEMP/imab-release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          IMAB_KEYSTORE_PASSWORD: ${{ secrets.IMAB_KEYSTORE_PASSWORD }}
          IMAB_KEY_ALIAS: ${{ secrets.IMAB_KEY_ALIAS }}
          IMAB_KEY_PASSWORD: ${{ secrets.IMAB_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --no-build-cache :composeApp:assembleRelease
          rm -f "$IMAB_KEYSTORE_FILE"
      - name: Rename
        run: |
          mkdir out
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "out/IMAB-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/*

  mac:
    needs: [version, audit]
    strategy:
      matrix:
        include:
          - name: apple-silicon
            runner: macos-15
          - name: intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: ./gradlew --no-daemon --no-build-cache :composeApp:packageDmg
      - name: Rename
        run: |
          mkdir out
          cp composeApp/build/compose/binaries/main/dmg/*.dmg "out/IMAB-${{ needs.version.outputs.version }}-mac-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-${{ matrix.name }}
          path: out/*

  windows:
    needs: [version, audit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        shell: bash
        run: ./gradlew --no-daemon --no-build-cache :composeApp:packageMsi
      - name: Rename
        shell: bash
        run: |
          mkdir out
          cp composeApp/build/compose/binaries/main/msi/*.msi "out/IMAB-${{ needs.version.outputs.version }}-windows.msi"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/*

  release:
    needs: [version, android, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Release notes from CHANGELOG.md
        run: |
          version=${{ needs.version.outputs.version }}
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-install.md >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.apk' -o -name '*.dmg' -o -name '*.msi' \) -exec cp {} dist/ \;
          ls -la dist
          [ "$(ls dist | wc -l)" -eq 4 ] || { echo "::error::Expected 4 installers"; exit 1; }
          # Creates the tag on this commit when the release was started from the Actions tab.
          gh release create "${{ needs.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "IMAB ${{ needs.version.outputs.version }}" \
            --notes-file notes.md
