org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Homebrew's OpenJDK packages the Mac app fine for personal use; Compose warns about it by default.
compose.desktop.packaging.checkJdkVendor=false
# App version, used by the Android and Mac builds and shown in Settings. Bump with each release
# (see CHANGELOG.md); versionCode must go up by one every time.
imab.versionName=1.8.0
imab.versionCode=12
